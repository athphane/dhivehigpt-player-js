<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>DhivehiGPT Player — Alpine.js example</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>
<body style="font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px;">
  <h1>Alpine.js example</h1>
  <p>
    <code>data-dhivehigpt-player</code> works as-is alongside Alpine. This also demonstrates
    <code>x-if</code> adding/removing the player — <code>watch()</code> (enabled automatically by this
    CDN build) converts it when added and cleans it up when removed, with no leaks.
  </p>

  <div x-data="{ show: true }">
    <button type="button" @click="show = !show">Toggle player</button>

    <template x-if="show">
      <audio
        data-dhivehigpt-player
        data-accent="true"
        src="https://dvgpt.s3.ap-southeast-1.amazonaws.com/de2a034d-cf77-4f63-87f0-9849962bf0f5/c0346207-9382-4d54-8bb2-5b598ffe555d.wav"
      ></audio>
    </template>
  </div>

  <h2 style="margin-top: 32px">Driven from Alpine state</h2>
  <div x-data="{ player: null }" x-init="player = new window.DhivehiGPTPlayer.AudioPlayer($refs.audio2, { accent: true })">
    <audio
      x-ref="audio2"
      src="https://dvgpt.s3.ap-southeast-1.amazonaws.com/de2a034d-cf77-4f63-87f0-9849962bf0f5/c0346207-9382-4d54-8bb2-5b598ffe555d.wav"
    ></audio>
    <div style="margin-top: 8px">
      <button type="button" @click="player.toggle()">Toggle play/pause</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@javaabu/dhivehigpt-player/dist/dhivehigpt-player.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js" defer></script>
</body>
</html>
