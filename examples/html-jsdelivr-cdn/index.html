<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>DhivehiGPT Player — jsDelivr CDN example</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>
<body style="font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px;">
  <h1>jsDelivr / CDN example</h1>
  <p>No build step, no npm install — just a script tag. Pin a version in production instead of using the unversioned URL.</p>

  <audio
    data-dhivehigpt-player
    src="https://dvgpt.s3.ap-southeast-1.amazonaws.com/de2a034d-cf77-4f63-87f0-9849962bf0f5/c0346207-9382-4d54-8bb2-5b598ffe555d.wav"
  ></audio>

  <!-- Latest release: -->
  <script src="https://cdn.jsdelivr.net/npm/@javaabu/dhivehigpt-player/dist/dhivehigpt-player.umd.min.js"></script>

  <!-- Pinned to a specific version (recommended for production):
  <script src="https://cdn.jsdelivr.net/npm/@javaabu/dhivehigpt-player@1.0.0/dist/dhivehigpt-player.umd.min.js"></script>
  -->
</body>
</html>
